[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fxfill-enterprise-banking-agent"
version = "0.1.0"
description = "Production-oriented banking knowledge agent evaluated against public tau2-bench banking_knowledge domain"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.4,<1.0",
    "langchain-core>=0.3,<1.0",
    "aiosqlite>=0.22.1",
    "structlog>=26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fxfill_banking_agent"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", ".claude", "scripts", "docs"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".git", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src/fxfill_banking_agent"]
exclude = [".venv", "tests"]
