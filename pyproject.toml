[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fxfill-enterprise-banking-agent"
version = "0.1.0"
description = "Production-oriented banking knowledge agent evaluated against public tau2-bench banking_knowledge domain"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.4,<1.0",
    "langchain-core>=0.3,<1.0",
    "aiosqlite>=0.22.1",
    "structlog>=26.1.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fxfill_banking_agent"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", ".claude", "scripts", "docs"]
asyncio_mode = "auto"
markers = [
    "live_provider: opt-in live provider smoke test (requires LIVE_PROVIDER_TEST=1 and DEEPSEEK_API_TOKEN)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".git", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src/fxfill_banking_agent"]
exclude = [".venv", "tests"]

[[tool.mypy.overrides]]
module = [
    "fxfill_banking_agent.providers.*",
    "fxfill_banking_agent.mcp.*",
    "fxfill_banking_agent.banking.*",
    "fxfill_banking_agent.bootstrap",
    "fxfill_banking_agent.grant_repo",
    "fxfill_banking_agent.hitl_signal",
]
disallow_untyped_defs = false
warn_unused_ignores = false
ignore_errors = true
